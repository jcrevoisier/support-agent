[project]
name = "support-agent"
version = "0.1.0"
description = "Customer support agent that collects ticket details by text or voice"
readme = "README.md"
authors = [
    { name = "Jerome Crevoisier", email = "crevoisierj@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "numpy>=2.4.6",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
]

[project.scripts]
support-agent = "support_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
